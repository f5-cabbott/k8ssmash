[project]
name = "k8ssmash"
version = "0.1.0"
description = "Kubernetes-themed SNES-style platform fighter for KubeCon"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

[project.scripts]
k8ssmash = "k8ssmash.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["k8ssmash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
